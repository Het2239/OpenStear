<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>OpenSteer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="pad"></main>

  <div id="overlay">
    <div class="card">
      <h1>OpenSteer</h1>
      <p id="overlay-msg"></p>
      <button id="start" type="button">Start</button>
      <p class="small"><button id="overlay-layout" type="button" class="link"></button></p>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="sheet">
      <header>
        <h2>Layout</h2>
        <button id="menu-close" type="button" class="chip">Close</button>
      </header>
      <div id="menu-list"></div>
      <p id="menu-notes" class="small"></p>
    </div>
  </div>

  <div id="rotate">Turn the phone to landscape</div>

  <script type="module" src="app.js"></script>
</body>
</html>
