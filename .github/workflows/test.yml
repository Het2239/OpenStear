name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # vgamepad is left out here; the vigem job below covers it.
      - run: pip install aiohttp "qrcode[pil]" cryptography psutil pytest pytest-aiohttp
      - run: python -m pytest -v --junitxml=junit.xml
      - if: failure()
        run: python .github/scripts/annotate_failures.py junit.xml

  # Installs the real ViGEmBus driver and checks that a virtual pad driven by
  # host/gamepad.py shows up in XInput with the right values. Manual only:
  # the driver install hangs on GitHub-hosted runners (no one to accept the
  # driver prompt). Run tests/test_vigem_real.py on a real Windows PC instead.
  vigem:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The ViGEmBus MSI bundled in vgamepad's sdist (the same one its setup.py
      # would launch interactively). MSI installs log to a readable text file.
      - name: Install ViGEmBus driver
        shell: pwsh
        timeout-minutes: 6
        run: |
          pip download vgamepad==0.1.0 --no-deps --no-binary :all: -d dl
          $hash = (Get-FileHash dl\vgamepad-0.1.0.tar.gz -Algorithm SHA256).Hash
          if ($hash -ne "57F6BD01AEC0C172947517FB782D150EF9B285F7F4D524C317374FA5C24A89DE") { throw "checksum mismatch: $hash" }
          tar -xzf dl\vgamepad-0.1.0.tar.gz -C dl
          $msi = Resolve-Path dl\vgamepad-0.1.0\vgamepad\win\vigem\install\x64\ViGEmBusSetup_x64.msi
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/norestart","/l*v","`"$PWD\msi.log`"" -PassThru
          $done = $p.WaitForExit(240000)
          if (-not $done -or $p.ExitCode -notin 0, 3010) {
            if (Test-Path msi.log) {
              Get-Content msi.log | Select-String -Pattern "error|Return value 3|failed|DIFx|driver" | Select-Object -Last 20 |
                ForEach-Object { Write-Output "::warning::$($_.Line)" }
            }
            throw "msiexec did not succeed (finished: $done, exit: $($p.ExitCode))"
          }
          Get-PnpDevice -FriendlyName "*Virtual Gamepad Emulation*" -ErrorAction SilentlyContinue | Format-Table -AutoSize
      # With the driver present, vgamepad's setup skips its own interactive installer.
      - run: pip install -r requirements-dev.txt
        timeout-minutes: 5
      - run: python -m pytest -v tests/test_vigem_real.py tests/test_gamepad.py --junitxml=junit.xml
        env:
          OPENSTEAR_VIGEM_TEST: "1"
      - if: failure()
        run: python .github/scripts/annotate_failures.py junit.xml
